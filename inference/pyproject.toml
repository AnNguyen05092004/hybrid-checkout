[project]
name = "hybrid-checkout-inference"
version = "0.1.0"
description = "Recognition service of HybridCheckout (api/inference.openapi.yaml)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "pillow>=11.0",
    "torch>=2.5",
    "torchvision>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"
