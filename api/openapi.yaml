      description: Báo nhầm chưa hậu kiểm, xếp theo ưu tiên BR-17 rồi theo giá trị. `reasons` cho biết vì sao cần xem trước (view `v_review_queue`).
      x-roles: [STORE_MANAGER]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Hàng đợi hậu kiểm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueuePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /alerts/{alertId}/false-alarm:
    parameters:
      - { $ref: '#/components/parameters/AlertId' }
    post:
      tags: [Alerts]
      operationId: confirmFalseAlarm
      summary: Thu ngân xác nhận camera báo nhầm
      description: Đóng cảnh báo mức Cao hoặc Trung bình ngay, không cần PIN, không giới hạn số lần (BR-04). Lý do bắt buộc; ảnh khay, người và thời gian được lưu để hậu kiểm.
      x-roles: [CASHIER, STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FalseAlarmRequest' }
      responses:
        '200':
          description: Giao dịch chứa cảnh báo, sau khi đóng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALERT_NOT_OPEN`; `ALERT_LOW_SEVERITY` — cảnh báo Thấp không cần xác nhận; `TRANSACTION_NOT_OPEN`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /alerts/{alertId}/review:
    parameters:
      - { $ref: '#/components/parameters/AlertId' }
    put:
      tags: [Alerts]
      operationId: reviewAlert
      summary: Hậu kiểm một báo nhầm
      description: Chỉ cho cảnh báo đã được thu ngân xác nhận báo nhầm (UC14). Gửi lại thì ghi đè kết quả cũ, nhật ký giữ cả hai lần.
      x-roles: [STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Cảnh báo sau khi hậu kiểm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALERT_NOT_FALSE_ALARM`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ catalog
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Danh sách nhóm hàng
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER]
      responses:
        '200':
          description: Nhóm hàng
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /skus:
    get:
      tags: [Catalog]
      operationId: listSkus
      summary: Danh mục SKU
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER]
      parameters:
        - name: q
          in: query
          description: Tìm theo tên hoặc mã vạch
          schema: { type: string, maxLength: 100 }
        - { name: category_id, in: query, schema: { type: integer, format: int64 } }
        - { name: learn_status, in: query, schema: { $ref: '#/components/schemas/LearnStatus' } }
        - { name: is_selling, in: query, schema: { type: boolean } }
        - { name: batch_id, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Một trang SKU và thẻ tóm tắt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Catalog]
      operationId: createSku
      summary: Thêm SKU
      description: SKU mới ở trạng thái Chưa học (US15). Mã vạch không trùng (BR-14).
      x-roles: [STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuCreate' }
      responses:
        '201':
          description: Đã thêm
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`BARCODE_TAKEN`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /skus/import:
    post:
      tags: [Catalog]
      operationId: importSkus
      summary: Nhập SKU từ CSV
      description: |
        Cột `barcode,name,category_code,price_vnd`. Tất cả hoặc không: một dòng lỗi thì không nhập dòng nào, trả danh sách lỗi theo dòng.
        `dry_run=true` chỉ kiểm tra.
      x-roles: [STORE_MANAGER]
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: text/csv, description: 'Tối đa 2 MB, 5.000 dòng, UTF-8' }
      responses:
        '200':
          description: Kết quả nhập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuImportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /skus/{skuId}:
    parameters:
      - { $ref: '#/components/parameters/SkuId' }
    get:
      tags: [Catalog]
      operationId: getSku
      summary: Chi tiết SKU
      description: Kèm trạng thái học, SKU hay bị nhầm với và ảnh cắt đã nhận (M06).
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      responses:
        '200':
          description: SKU
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      operationId: updateSku
      summary: Sửa SKU, đổi giá, ngừng bán
      description: Chỉ quản lý (BR-14). Đổi giá không ảnh hưởng giao dịch cũ vì dòng giữ giá lúc bán. Ghi nhật ký.
      x-roles: [STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuUpdate' }
      responses:
        '200':
          description: SKU sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ batches
  /batches:
