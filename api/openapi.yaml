openapi: 3.1.0
info:
  title: HybridCheckout API
  version: 1.0.0
  summary: API của hệ thống thanh toán tại quầy kết hợp mã vạch và thị giác máy tính.
  description: |
    Contract của backend (design-first): backend FastAPI phải khớp file này, frontend sinh kiểu TypeScript từ file này.

    - Tên path, field, enum bằng tiếng Anh, khớp `database/schema.dbml`. Mô tả bằng tiếng Việt.
    - Tiền là số nguyên VND, field có hậu tố `_vnd`. Thời điểm theo ISO 8601 có múi giờ. Box chuẩn hóa về 0..1.
    - Lỗi trả về `application/problem+json` (RFC 9457) với `code` ổn định để frontend rẽ nhánh.
    - Phân quyền kiểm tra ở backend (BR-15). `x-roles` ghi vai trò được gọi thao tác.
    - Mã quy tắc (BR-xx) và use case (UCxx) tham chiếu `docs/02-use-case-user-stories.md`.
servers:
  - url: /api/v1
    description: Cùng origin với web app (nginx chuyển /api sang backend)
  - url: http://localhost:8000/api/v1
    description: Backend chạy local
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Đăng nhập, làm mới token, đăng xuất.
  - name: Profile
    description: Hồ sơ của người đang đăng nhập, đổi mật khẩu, PIN quản lý.
  - name: Counters
    description: Quầy và camera; thu ngân xem để chọn quầy, quản trị viên thêm và sửa.
  - name: Shifts
    description: Mở ca, tổng kết ca, đóng ca.
  - name: Checkout
    description: Giao dịch tại quầy — quét mã, chụp và đối chiếu khay, xóa dòng, thanh toán, hủy (UC05–UC12).
  - name: Alerts
    description: Cảnh báo đối chiếu, báo nhầm, hậu kiểm theo ưu tiên (UC08, UC14, BR-04, BR-17).
  - name: Catalog
    description: Nhóm hàng và danh mục SKU (UC15).
  - name: Batches
    description: Đợt nhập, ảnh mẫu, ảnh ghép, gửi huấn luyện (UC16, UC17, UC19).
  - name: Labeling
    description: Gán nhãn ảnh thật có trợ lý và hàng đợi ảnh khó (UC18).
  - name: Jobs
    description: Job chạy nền — ghép ảnh, huấn luyện, đánh giá (UC20).
  - name: Models
    description: Phiên bản model, cổng duyệt, deploy, rollback (UC21, UC22).
  - name: Thresholds
    description: Ngưỡng nhận diện theo đợt, xem trước tác động, lịch sử (UC23).
  - name: Reports
    description: Dashboard, thống kê theo thu ngân, giám sát model (UC13, UC24).
  - name: Users
    description: Quản trị người dùng (UC25).
  - name: System
    description: Nhật ký, cài đặt lưu trữ, health check (UC27, UC28).

paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập
      description: |
        Trả access token (JWT, 15 phút) và đặt refresh token vào cookie `hc_refresh` (httpOnly, SameSite=Strict, 12 giờ — đủ một ca).
        Sai email hoặc mật khẩu, hay tài khoản bị khóa đều trả cùng một lỗi (US01).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: thu.ngan@hybrid.vn, password: matkhau123 }
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Làm mới access token
      description: Đọc cookie `hc_refresh`, cấp access token mới và xoay vòng refresh token. Refresh token đã dùng hoặc đã thu hồi thì bị từ chối.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Token mới
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Đăng xuất
      description: Thu hồi refresh token và xóa cookie. Access token còn hạn tự hết sau tối đa 15 phút.
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER, ADMIN]
      responses:
        '204': { description: Đã đăng xuất }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ profile
  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Xem hồ sơ
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER, ADMIN]
      responses:
        '200':
          description: Hồ sơ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Sửa họ tên
      description: Không tự đổi được vai trò hay trạng thái (US03).
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Hồ sơ sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/password:
    put:
      tags: [Profile]
      operationId: changePassword
      summary: Đổi mật khẩu
      description: Cần mật khẩu cũ; mật khẩu mới ≥ 8 ký tự. Đổi xong thu hồi mọi refresh token khác của người này.
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Đã đổi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/pin:
    put:
      tags: [Profile]
      operationId: setManagerPin
      summary: Đặt hoặc đổi PIN quản lý
      description: PIN 6 số, chỉ lưu bản băm, không trả lại sau khi lưu. Hai quản lý không được trùng PIN (quầy so PIN với mọi quản lý).
      x-roles: [STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinSet' }
      responses:
        '204': { description: Đã lưu PIN }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ counters
  /counters:
    get:
      tags: [Counters]
      operationId: listCounters
      summary: Danh sách quầy
      description: Kèm trạng thái camera (online nếu có heartbeat trong 30 giây) và ca đang mở. Thu ngân dùng ở màn Mở ca (P01).
      x-roles: [CASHIER, STORE_MANAGER, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/IncludeInactive' }
      responses:
        '200':
          description: Các quầy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Counter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Counters]
      operationId: createCounter
      summary: Thêm quầy
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterCreate' }
      responses:
        '201':
          description: Đã thêm
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Counter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /counters/{counterId}:
    parameters:
      - { $ref: '#/components/parameters/CounterId' }
    patch:
      tags: [Counters]
      operationId: updateCounter
      summary: Sửa quầy, gán camera, ngừng dùng
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterUpdate' }
      responses:
        '200':
          description: Quầy sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Counter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /counters/{counterId}/test-capture:
    parameters:
      - { $ref: '#/components/parameters/CounterId' }
    post:
      tags: [Counters]
      operationId: testCapture
      summary: Chụp thử camera
      description: Chụp một ảnh để kiểm tra kết nối (US26). Ảnh không gắn với giao dịch và tự xóa sau 1 giờ.
      x-roles: [CASHIER, STORE_MANAGER, ADMIN]
      responses:
        '200':
          description: Ảnh chụp thử
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCapture' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/CameraUnavailable' }

  # ------------------------------------------------------------------ shifts
  /shifts:
    post:
      tags: [Shifts]
      operationId: openShift
      summary: Mở ca
      description: Mỗi quầy và mỗi thu ngân chỉ có một ca mở (US04). Quản lý mở ca cho chính mình khi đứng quầy.
      x-roles: [CASHIER, STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftOpen' }
      responses:
        '201':
          description: Ca đã mở
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`SHIFT_ALREADY_OPEN` — quầy hoặc người này đã có ca mở; `COUNTER_INACTIVE`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /shifts/current:
    get:
      tags: [Shifts]
      operationId: getCurrentShift
      summary: Ca đang mở của tôi
      description: Kèm giao dịch OPEN (nếu có) để màn quầy khôi phục giỏ hàng sau khi tải lại trang.
      x-roles: [CASHIER, STORE_MANAGER]
      responses:
        '200':
          description: Ca đang mở
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentShift' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NO_OPEN_SHIFT` — chưa mở ca, frontend chuyển sang P01.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /shifts/{shiftId}/summary:
    parameters:
      - { $ref: '#/components/parameters/ShiftId' }
    get:
      tags: [Shifts]
      operationId: getShiftSummary
      summary: Tổng kết ca
      description: Số giao dịch, doanh thu, tiền mặt dự kiến, cảnh báo theo cách xử lý (P06). Thu ngân chỉ xem ca của mình.
      x-roles: [CASHIER, STORE_MANAGER]
      responses:
        '200':
          description: Tổng kết
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shifts/{shiftId}/close:
    parameters:
      - { $ref: '#/components/parameters/ShiftId' }
    post:
      tags: [Shifts]
      operationId: closeShift
      summary: Đóng ca
      description: Ghi tiền mặt thực đếm, trả chênh lệch so với dự kiến. Không đóng được khi còn giao dịch OPEN.
      x-roles: [CASHIER, STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftClose' }
      responses:
        '200':
          description: Ca đã đóng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SHIFT_CLOSED`; `TRANSACTION_STILL_OPEN` — thanh toán hoặc hủy giao dịch đang mở trước.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ checkout
  /transactions:
    get:
      tags: [Checkout]
      operationId: listTransactions
      summary: Danh sách giao dịch
      description: Quản lý xem toàn cửa hàng (M04); thu ngân chỉ thấy ca của mình (P06), backend tự lọc theo người gọi.
      x-roles: [CASHIER, STORE_MANAGER]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: shift_id, in: query, schema: { type: integer, format: int64 } }
        - { name: counter_id, in: query, schema: { type: integer, format: int64 } }
        - { name: mode, in: query, schema: { $ref: '#/components/schemas/CheckoutMode' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransactionStatus' } }
        - name: has_alerts
          in: query
          description: Chỉ giao dịch có cảnh báo mức Cao hoặc Trung bình
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Một trang giao dịch, mới nhất trước
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Checkout]
      operationId: createTransaction
      summary: Bắt đầu giao dịch
      description: Gọi ở lần quét đầu tiên hoặc khi bấm Nhận diện khay; gắn với ca đang mở của người gọi. Mỗi ca chỉ một giao dịch OPEN.
      x-roles: [CASHIER, STORE_MANAGER]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Giao dịch mới, trạng thái OPEN
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`NO_OPEN_SHIFT`; `TRANSACTION_ALREADY_OPEN` — `detail` chứa id giao dịch đang mở.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /transactions/{transactionId}:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    get:
      tags: [Checkout]
      operationId: getTransaction
      summary: Xem giao dịch
      description: |
        Trạng thái đầy đủ cho màn quầy và màn Chi tiết giao dịch (M03): dòng, dòng đã xóa, lần chụp khay gần nhất kèm box,
        cảnh báo, xác nhận của quản lý và `pay_blockers` (lý do nút Thanh toán đang khóa).
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER]
      responses:
        '200':
          description: Giao dịch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Checkout]
      operationId: changeCheckoutMode
      summary: Đổi chế độ quầy
      description: Chỉ đổi được khi giỏ trống và chưa chụp khay.
      x-roles: [CASHIER, STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Giao dịch sau khi đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`MODE_LOCKED` — giỏ đã có hàng; `TRANSACTION_NOT_OPEN`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /transactions/{transactionId}/lines:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Checkout]
      operationId: scanItem
      summary: Quét mã một món
      description: |
        Thêm dòng theo mã vạch; cùng SKU thì tăng số lượng (US05). Giá lấy tại thời điểm quét (BR-06).

        - Làn nhanh: gửi `detection_id` khi quét để xác nhận một box màu cam. Mã khác SKU model đoán thì box được ghi là bản sửa (US10).
        - Nếu đã đối chiếu, đối chiếu chạy lại trên ảnh khay: cảnh báo không còn đúng sẽ tự đóng với `SCANNED` (UC08).
      x-roles: [CASHIER, STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
            example: { barcode: '2000000000015', qty: 1 }
      responses:
        '200':
          description: Giao dịch sau khi quét
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSACTION_NOT_OPEN`; `DETECTION_ALREADY_CONFIRMED`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`BARCODE_NOT_FOUND`; `SKU_NOT_SELLING`; `VALIDATION_ERROR`. Không thêm dòng.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /transactions/{transactionId}/lines/{lineId}:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
      - { $ref: '#/components/parameters/LineId' }
    delete:
      tags: [Checkout]
      operationId: removeLine
      summary: Xóa dòng
      description: |
        Thu ngân tự xóa, không cần PIN, không phải chụp lại (BR-05). Dòng được giữ với người, lý do, thời gian để hậu kiểm (BR-17).
        Khi đối chiếu, dòng xóa với `CUSTOMER_DECLINED` được trừ khỏi ảnh khay (khách đã trả lại món); lý do khác thì món vẫn tính là trên khay.
      x-roles: [CASHIER, STORE_MANAGER]
      parameters:
        - name: reason
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RemovalReason' }
      responses:
        '200':
          description: Giao dịch sau khi xóa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSACTION_NOT_OPEN`; `LINE_ALREADY_REMOVED`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /transactions/{transactionId}/tray-checks:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Checkout]
      operationId: captureTray
      summary: Chụp khay
      description: |
        Backend chụp ảnh từ camera của quầy, gửi dịch vụ nhận diện và lưu box. Mục tiêu ≤ 3 giây (G5).

        - Kiểm tra chéo: web app gọi ngay khi tạo giao dịch, lúc khách vừa đặt hàng lên quầy, trước khi hàng vào túi. Chưa đối chiếu, chưa sinh cảnh báo; đối chiếu khi bấm Thanh toán (`reconciliation`).
        - Làn nhanh: gọi khi bấm Nhận diện khay. Box của SKU đã học có độ tin ≥ ngưỡng tự nhận được thêm thành dòng nguồn `CAMERA`; box không chắc có `needs_confirmation`.
        - Gọi lại (Chụp lại khay) thì lần chụp mới thay lần trước.
        - Camera hoặc nhận diện lỗi **không** trả mã lỗi HTTP: lần chụp được lưu với `status: FAILED` để đếm số lần lỗi. Sau 2 lần lỗi liên tiếp, quản lý có thể cho bỏ qua (UC12).
      x-roles: [CASHIER, STORE_MANAGER]
      responses:
        '201':
          description: Đã chụp; `latest_capture` là lần chụp này
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSACTION_NOT_OPEN`; `NO_ACTIVE_MODEL`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /transactions/{transactionId}/reconciliation:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Checkout]
      operationId: reconcileTray
      summary: Đối chiếu khay
      description: |
        Kiểm tra chéo, khi thu ngân bấm Thanh toán: so ảnh khay lúc khách đặt hàng với danh sách đã quét (UC07) và sinh cảnh báo.
        `pay_blockers` rỗng thì web app mở hộp thoại thanh toán; còn cảnh báo Cao thì thu ngân xử lý (UC08) rồi bấm lại.
        Từ lúc này, mỗi lần quét hoặc xóa dòng thì đối chiếu tự chạy lại. Gọi lại nhiều lần cho cùng kết quả.
      x-roles: [CASHIER, STORE_MANAGER]
      responses:
        '200':
          description: Kết quả đối chiếu; `reconciled` là true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
              examples:
                unscanned:
                  $ref: '#/components/examples/CheckoutWithUnscannedAlert'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSACTION_NOT_OPEN`; `NOT_VERIFY_MODE` — làn nhanh đối chiếu ngay khi xác nhận xong.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /transactions/{transactionId}/pay:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Checkout]
      operationId: payTransaction
      summary: Thanh toán
      description: |
        Backend đối chiếu lại rồi kiểm tra mọi điều kiện, không tin nút trên giao diện (BR-03, BR-15). Sau khi thanh toán, giao dịch không sửa được (US11).
        Gửi lại cùng `Idempotency-Key` (mạng chập chờn) trả về đúng kết quả lần đầu, không tính tiền hai lần.
      x-roles: [CASHIER, STORE_MANAGER]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRequest' }
            example: { payment_method: CASH, cash_received_vnd: 200000 }
      responses:
        '200':
          description: Đã thanh toán; `receipt` có hóa đơn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `PAYMENT_BLOCKED` — `blockers` liệt kê lý do (cùng giá trị với `pay_blockers`); `TRANSACTION_NOT_OPEN`;
            `IDEMPOTENCY_KEY_REUSED` — cùng key nhưng nội dung khác.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://hybridcheckout.local/problems/payment-blocked
                title: Chưa thanh toán được
                status: 409
                code: PAYMENT_BLOCKED
                detail: Còn 1 cảnh báo mức Cao.
                blockers: [OPEN_HIGH_ALERTS]
        '422':
          description: '`CASH_NOT_ENOUGH`; `OUTSIDE_ZONE_NOT_CONFIRMED` (làn nhanh); `VALIDATION_ERROR`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /transactions/{transactionId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Checkout]
      operationId: cancelTransaction
      summary: Hủy giao dịch (PIN quản lý)
      description: Cần PIN của một quản lý khác người đang đứng quầy (UC12). Lưu người xác nhận, lý do, thời gian.
      x-roles: [CASHIER, STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerApprovalRequest' }
      responses:
        '200':
          description: Giao dịch đã hủy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PinRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSACTION_NOT_OPEN`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423': { $ref: '#/components/responses/PinLocked' }
  /transactions/{transactionId}/skip-tray-check:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    post:
      tags: [Checkout]
      operationId: skipTrayCheck
      summary: Bỏ qua kiểm tra khay (PIN quản lý)
      description: Chỉ được khi 2 lần chụp gần nhất đều lỗi (UC05). Giao dịch được ghi là "không kiểm tra".
      x-roles: [CASHIER, STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerApprovalRequest' }
      responses:
        '200':
          description: Giao dịch sau khi bỏ qua
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PinRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SKIP_NOT_ALLOWED` — chưa đủ 2 lần chụp lỗi liên tiếp; `TRANSACTION_NOT_OPEN`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423': { $ref: '#/components/responses/PinLocked' }

  # ------------------------------------------------------------------ alerts
  /alerts:
    get:
      tags: [Alerts]
