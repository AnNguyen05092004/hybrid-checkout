        - { name: severity, in: query, schema: { $ref: '#/components/schemas/AlertSeverity' } }
        - { name: resolution, in: query, schema: { $ref: '#/components/schemas/AlertResolution' } }
        - { name: cashier_id, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Một trang cảnh báo, mới nhất trước
