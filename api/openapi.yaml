        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Batches]
      operationId: createBatch
      summary: Tạo đợt nhập
      description: Gom các SKU Chưa học thành một đợt; SKU chuyển sang Đang học (US16).
      x-roles: [STORE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
