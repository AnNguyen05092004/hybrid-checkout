        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`SKU_NOT_UNLEARNED` — `detail` liệt kê SKU đã thuộc một đợt.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /batches/{batchId}:
    parameters:
      - { $ref: '#/components/parameters/BatchId' }
    get:
      tags: [Batches]
      operationId: getBatch
      summary: Chi tiết đợt nhập
      description: Tiến trình, dữ liệu theo SKU so với mục tiêu BR-11, điều kiện gửi huấn luyện, job và phiên bản của đợt (M08).
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      responses:
        '200':
          description: Đợt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /batches/{batchId}/samples:
    parameters:
      - { $ref: '#/components/parameters/BatchId' }
    get:
      tags: [Batches]
      operationId: listSamples
      summary: Ảnh mẫu và ảnh cắt nền của đợt
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      parameters:
        - { name: sku_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SampleStatus' } }
      responses:
        '200':
          description: Ảnh mẫu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkuSample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Batches]
      operationId: uploadSamples
      summary: Tải ảnh mẫu của một SKU mới
      description: |
        Mỗi ảnh một sản phẩm, chụp từ trên xuống (UC17). Cắt nền chạy nền qua dịch vụ nhận diện; trong lúc đó `cutout_url` là null.
        Frontend hỏi lại `listSamples` đến khi mọi ảnh có ảnh cắt.
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sku_id, files]
              properties:
                sku_id: { type: integer, format: int64 }
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, contentMediaType: image/jpeg, description: 'JPEG hoặc PNG, ≤ 10 MB mỗi ảnh' }
            encoding:
              files: { contentType: 'image/jpeg, image/png' }
      responses:
        '202':
          description: Đã nhận ảnh, đang cắt nền
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkuSample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`BATCH_NOT_COLLECTING` — đợt đã gửi huấn luyện; `SKU_NOT_IN_BATCH`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /batches/{batchId}/samples/review:
    parameters:
      - { $ref: '#/components/parameters/BatchId' }
    post:
      tags: [Batches]
      operationId: reviewSamples
      summary: Nhận hoặc loại ảnh cắt (hàng loạt)
      x-roles: [ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SampleReview' }
      responses:
        '200':
          description: Các ảnh sau khi duyệt
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkuSample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CUTOUT_NOT_READY` — ảnh chưa cắt nền xong; `BATCH_NOT_COLLECTING`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /batches/{batchId}/composites:
    parameters:
      - { $ref: '#/components/parameters/BatchId' }
    post:
      tags: [Batches]
      operationId: createComposites
      summary: Tạo ảnh ghép
      description: Tạo job `COMPOSITE` dán ảnh cắt đã nhận lên nền khay. Chỉ khi mọi SKU mới đủ ảnh cắt (BR-11, US17).
      x-roles: [ML_ENGINEER]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompositeRequest' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BatchNotReady' }
  /batches/{batchId}/training:
    parameters:
      - { $ref: '#/components/parameters/BatchId' }
    post:
      tags: [Batches]
      operationId: startTraining
      summary: Gửi huấn luyện
      description: |
        Tạo job `TRAIN`; job xong thì tự chạy `EVAL` và sinh phiên bản Chờ duyệt. Chỉ khi đạt đủ BR-11.
        `mix_real_images` > 0 trộn ảnh thật vượt mức vào huấn luyện (BR-16, thí nghiệm), ghi vào `params` của job.
      x-roles: [ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingRequest' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BatchNotReady' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ labeling
  /label-tasks:
    get:
      tags: [Labeling]
      operationId: listLabelTasks
      summary: Hàng đợi ảnh thật
      description: '`batch_id` bỏ trống và `unassigned=true` để xem ảnh khó đang chờ đợt sau.'
      x-roles: [ML_ENGINEER]
      parameters:
        - { name: batch_id, in: query, schema: { type: integer, format: int64 } }
        - { name: unassigned, in: query, schema: { type: boolean, default: false } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LabelStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Một trang ảnh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelTaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Labeling]
      operationId: queueHardImage
      summary: Gửi ảnh khay vào hàng đợi ảnh khó
      description: Từ Chi tiết giao dịch (M03) hoặc Giám sát (L07). Ảnh được chép sang kho dữ liệu nên không bị xóa sau 30 ngày; gắn vào đợt đang thu thập, nếu không có thì chờ đợt sau.
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HardImageRequest' }
      responses:
        '201':
          description: Đã vào hàng đợi
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelTaskSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALREADY_QUEUED`; `IMAGE_PURGED` — ảnh đã quá hạn lưu.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /label-tasks/next:
    get:
      tags: [Labeling]
      operationId: getNextLabelTask
      summary: Ảnh tiếp theo cần gán nhãn
      x-roles: [ML_ENGINEER]
      parameters:
        - name: batch_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Ảnh tiếp theo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelTask' }
        '204': { description: Hết ảnh trong hàng đợi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /label-tasks/{taskId}:
    parameters:
      - { $ref: '#/components/parameters/TaskId' }
    get:
      tags: [Labeling]
      operationId: getLabelTask
      summary: Xem một ảnh cần gán nhãn
      description: Ảnh, box hàng cũ do model đề xuất (từ lần nhận diện tại quầy) và hàng mới theo mã vạch cần vẽ.
      x-roles: [ML_ENGINEER]
      responses:
        '200':
          description: Ảnh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /label-tasks/{taskId}/submit:
    parameters:
      - { $ref: '#/components/parameters/TaskId' }
    post:
      tags: [Labeling]
      operationId: submitLabels
      summary: Lưu nhãn vào tập dữ liệu
      description: |
        Mọi đề xuất phải được chấp nhận hoặc từ chối (BR-12). Chỉ box được chấp nhận và box vẽ tay thành nhãn.
        Backend chọn tập: VAL trước, TRAIN chỉ khi vượt mục tiêu BR-11 và đợt bật trộn ảnh thật; không chia một giao dịch vào hai tập (BR-16).
      x-roles: [ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelSubmit' }
      responses:
        '200':
          description: Ảnh đã lưu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `TASK_NOT_PENDING`; `PROPOSALS_UNDECIDED` — còn đề xuất chưa duyệt;
            `COUNT_MISMATCH` — số box hàng mới khác số lượng theo mã vạch, gửi lại với `acknowledge_count_mismatch: true` nếu chắc chắn.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /label-tasks/{taskId}/skip:
    parameters:
      - { $ref: '#/components/parameters/TaskId' }
    post:
      tags: [Labeling]
      operationId: skipLabelTask
      summary: Bỏ qua ảnh
      description: Ảnh mờ hoặc không có hàng mới; lý do bắt buộc.
      x-roles: [ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Ảnh đã bỏ qua
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelTaskSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TASK_NOT_PENDING`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ jobs
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: Danh sách job
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      parameters:
        - { name: batch_id, in: query, schema: { type: integer, format: int64 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/JobType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/JobStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Một trang job, mới nhất trước
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /jobs/{jobId}:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Xem job
      description: Frontend hỏi lại mỗi 3 giây khi job đang chạy.
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/log:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [Jobs]
      operationId: getJobLog
      summary: Xem log job
      x-roles: [ML_ENGINEER]
      parameters:
        - name: tail
          in: query
          description: Số dòng cuối
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
      responses:
        '200':
          description: Log dạng văn bản
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Hủy job
      x-roles: [ML_ENGINEER]
      responses:
        '200':
          description: Job sau khi hủy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`JOB_FINISHED`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /jobs/{jobId}/retry:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
    post:
      tags: [Jobs]
      operationId: retryJob
      summary: Chạy lại job
      description: Tạo job mới cùng loại và tham số với job lỗi hoặc đã hủy.
      x-roles: [ML_ENGINEER]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`JOB_NOT_RETRYABLE` — job chưa lỗi/hủy; `JOB_ALREADY_RUNNING` — đợt đã có job cùng loại đang chạy.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ models
  /model-versions:
    get:
      tags: [Models]
      operationId: listModelVersions
      summary: Danh sách phiên bản model
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ModelStatus' } }
      responses:
        '200':
          description: Các phiên bản, mới nhất trước
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-versions/active:
    get:
      tags: [Models]
      operationId: getActiveModelVersion
      summary: Phiên bản đang chạy
      description: Hiện trên thanh trạng thái quầy và thanh trên khu quản trị.
      x-roles: [CASHIER, STORE_MANAGER, ML_ENGINEER, ADMIN]
      responses:
        '200':
          description: Phiên bản đang chạy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`NO_ACTIVE_MODEL` — chưa deploy phiên bản nào; quầy chỉ bán bằng mã vạch.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /model-versions/{versionId}:
    parameters:
      - { $ref: '#/components/parameters/VersionId' }
    get:
      tags: [Models]
      operationId: getModelVersion
      summary: Chi tiết phiên bản và cổng duyệt
      description: Từng điều kiện BR-09 với giá trị mới, giá trị bản đang chạy, Đạt/Không đạt (US21); top cặp SKU hay nhầm.
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      responses:
        '200':
          description: Phiên bản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelVersionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /model-versions/{versionId}/deploy:
    parameters:
      - { $ref: '#/components/parameters/VersionId' }
    post:
      tags: [Models]
      operationId: deployModelVersion
      summary: Deploy phiên bản
      description: |
        Chỉ một phiên bản chạy tại một thời điểm (BR-07). Không đạt cổng duyệt thì `reason` bắt buộc và được ghi là override (BR-08).
        Sau deploy, SKU của đợt thành Đã học và dịch vụ nhận diện nạp checkpoint mới.
      x-roles: [ML_ENGINEER]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeployRequest' }
      responses:
        '200':
          description: Bản ghi deploy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`VERSION_NOT_PENDING`; `GATE_REASON_REQUIRED` — không đạt cổng mà thiếu lý do.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/InferenceUnavailable' }
  /model-versions/{versionId}/reject:
    parameters:
      - { $ref: '#/components/parameters/VersionId' }
    post:
      tags: [Models]
      operationId: rejectModelVersion
      summary: Từ chối phiên bản
      x-roles: [ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Phiên bản sau khi từ chối
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`VERSION_NOT_PENDING`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /model-deployments:
    get:
      tags: [Models]
      operationId: listDeployments
      summary: Lịch sử deploy và rollback
      x-roles: [STORE_MANAGER, ML_ENGINEER]
      responses:
        '200':
          description: Mới nhất trước
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Deployment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /model-deployments/rollback:
    post:
      tags: [Models]
      operationId: rollbackModel
      summary: Rollback về phiên bản liền trước
      description: Luôn rollback được (BR-08). SKU của đợt bị rollback về Đang học, đợt về Chờ duyệt. Lý do bắt buộc.
      x-roles: [ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Bản ghi rollback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`NO_PREVIOUS_VERSION`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InferenceUnavailable' }

  # ------------------------------------------------------------------ thresholds
  /thresholds:
    get:
      tags: [Thresholds]
      operationId: listThresholds
      summary: Ngưỡng đang áp dụng theo đợt
      x-roles: [ML_ENGINEER]
      responses:
        '200':
          description: Bản mới nhất của mỗi đợt
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ThresholdConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Thresholds]
      operationId: saveThresholds
      summary: Lưu ngưỡng mới cho một đợt
      description: Thêm một bản mới (không sửa bản cũ). Hoàn tác = lưu lại giá trị của một bản trong lịch sử (US23). Ghi nhật ký.
      x-roles: [ML_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThresholdInput' }
      responses:
        '201':
          description: Bản ngưỡng mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThresholdConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /thresholds/history:
    get:
      tags: [Thresholds]
      operationId: listThresholdHistory
      summary: Lịch sử ngưỡng của một đợt
      x-roles: [ML_ENGINEER]
      parameters:
        - name: batch_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Mới nhất trước
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ThresholdConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /thresholds/preview:
    post:
      tags: [Thresholds]
      operationId: previewThresholds
