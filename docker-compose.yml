# Whole system on one machine (docs/07-c4.md section 6).
#   docker compose up --build                  # everything except the GPU trainer
#   docker compose --profile gpu up --build    # also the trainer (needs the NVIDIA container runtime)
# Copy .env.example to .env first.

x-backend: &backend
  build: { context: ., dockerfile: backend/Dockerfile, target: api }
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    minio: { condition: service_started }

services:
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    build: { context: ., dockerfile: backend/Dockerfile, target: worker }
    command: celery -A app.worker.celery_app worker -Q cpu -B --loglevel info

  trainer:
    <<: *backend
    build: { context: ., dockerfile: backend/Dockerfile, target: trainer }
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  inference:
    build: { context: inference }
    env_file: .env
    ports: ["9100:9100"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hybrid_checkout
      POSTGRES_USER: hybrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybrid -d hybrid_checkout"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: [redis:/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  postgres:
  redis:
  minio:
